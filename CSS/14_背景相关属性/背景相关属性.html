<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>背景</title>
	<style>
        div{
            width: 400px;
            height: 400px;
            border:2px black solid;
            background-color: skyblue;
            /* 背景色默认是transparent,透明的 */
            background-image: url("./11.png");
            /* 设置背景图片 */
            background-repeat: repeat-x;
            /* 设置背景图片的重复方式 repeat,no-repeat,repeat-x(只在水平方向上重复)*/
            background-position: center;
            /* 控制背景图片的位置 right bottom ; center top;
            left center; center center;
            可以写关键词，也能写精准到像素的位置 */

            background-position: 10px 20px;
            /* 以div左上角和图片左上角为原点 */
            
            /* background: ; */
            /* 是的背景也有复合属性 */
        }
	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
	<div>你好呀</div>
</body>
</html>
