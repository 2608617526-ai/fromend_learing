<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title></title>
	<style>
        div{
            font-size:100px;
        }
        .kk1 {
            font-weight: lighter;
        }
        .kk2 {
            font-weight: normal;
        }
        .kk3{
            font-weight: bold;
        }
        /* bold，形容字是粗体的，形容人是大胆的冒失的 */
        .kk4{
            font-weight: bolder;
        }
        /* 至于为啥bolder不奏效，是因为微软雅黑的字体只有三种大小 */
        /* 这里你也可以写数值，但是正常来说字体在设计的时候没有这么精度 */
        /* 也许0-200是Ligter，以此类推 */
	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
	<div class="kk1">暨南大学</div>
    <div class="kk2">暨南大学</div>
    <div class="kk3">暨南大学</div>
    <div class="kk4">暨南大学</div>
</body>
</html>
