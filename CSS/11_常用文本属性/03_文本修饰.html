        div{
            font-size:40px;
        }
        .jnu1{
            text-decoration:overline;
            /* 上划线 */

        }
        .jnu2{
            text-decoration:underline wavy #00ff00;

            text-decoration: line-through;
        }
        .jnu4{

        }
        ins{

        }
        del{
            text-decoration: none;
        }
	</style>

	</script>

    <ins>测试1</ins>

    <!-- 标签del代表删除的文本 -->
