<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>margin注意事项2</title>
	<style>
        .box{
            width: 200px;
            height: 200px;
        }
        .box1{
            background-color: skyblue;

        }
        .box2{
            background-color: orange;
            margin-top: 50px;
            margin-bottom: 50px;
            }
        .box3{
            background-color: green;
        }
        #d1{
            margin-left:20px;
            margin-right:20px;
            background-color: gray;
        }
        #d2{
            margin-right:20px;
            background-color: blue;
        }

	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
    <div class="box box1">1</div>
    <div class="box box2">1</div>
    <div class="box box3">1</div>
    <span id="d1">kkk</span>
    <span id="d2">ggg</span>
	<!-- 学这个盒子模型，你需要知道的是css中每个元素都可以看成一个盒子，都是作为盒子在起作用的，这就是css的盒模型
    而你做出的页面，本质上就是一个个盒子共同作用的效果
    盒子的四大组成，content，padding，border，margin，都有一些基础的属性可以设置，这几节课就是在讲这些 -->

    <!-- 上左margin会影响自身的位置，下右margin会影响兄弟元素的位置 -->

    <!-- 对于一个块级元素来说，如果设置成margin:auto,那么在父元素的水平方向上会居中，这是因为margin-left:auto的含义是和左边有多远离多远 -->
   
    <!-- margin的值也可以是负数
    如果你把margin的上左设置成负数，那它会把自己往上左方向拖动，如果你把
    margin的右下设置成负数，那他会把别人往自己身上吸过来 -->
</body>
</html>
