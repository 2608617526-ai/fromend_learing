<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title>盒模型</title>
	<style>
        
        div{
           
            width: 400px;
            height: 400px;
             /* 内容区的宽高 */
            background-color: gray;
           /* content,内容区，元素真正的内容比如文字图片子元素会在这里显示 */
            padding: 20px;
             /* padding：内边距，内容区到边框之间的内部空白，：设置的北京暗色会填充到内边距区域 */
            
            border: 10px solid black;
            /* 边框，是盒子的视觉边界*/
            margin: 50px;
            /* margin是外边距，是盒子外部和其他元素之间的空白，作用是拉开两个元素之间的距离 ,只能影响位置，不能影响盒子大小*/


        }
	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
	<div>暨南大学</div>
</body>
</html>
