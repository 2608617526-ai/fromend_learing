<head>
	<meta charset="UTF-8">
	<title>布局技巧</title>
	<style>
        .outer{
            background-color: gray;
            width: 400px;
            height: 400px;
            
            overflow: hidden;
            text-align: center;
            /* 行内元素和行内块元素，再调整的时候都可以通过文本属性来调整来调整 
            所以当你调整的父元素的文本属性的时候，你会发现这个行内和行内块元素也会被调整居中，*/
            /* 甚至你给他写个line-height也行 */
            line-height: 400px;
            
        }
        .innner{
            background-color: orange;

            
        }
            
        
	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
	<div class="outer">
       <span class="inner">去约会吗?</span>
    </div>
</body>
