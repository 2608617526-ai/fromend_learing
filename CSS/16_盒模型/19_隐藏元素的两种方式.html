	<style>
        /* 想要把一个盒子藏起来有两种方式
        第一种：display: none;（彻底抹杀）
物理效果：元素彻底消失，它原本占据的空间也会被完全释放。
            第二种：visibility: hidden;（披上隐形斗篷）
物理效果：元素在视觉上消失了，但它原本占据的空间依然死死地占着。

通俗理解：快递箱还在原地，只是你给它披上了一件完美的“哈利波特隐形斗篷”。你看不见它，但如果你往前走，依然会被它绊倒。
但是！绑定的点击事件失效，你已经无法再点击到他 

        附赠第三种方式：opacity: 0;（变成玻璃）
虽然你只问了两种，但在现代前端开发中，还有第三种极常用的隐藏方式，通常用来做动画过渡。

物理效果：把元素的透明度降到 0（全透明）。

通俗理解：把纸箱换成了一块极其纯净、完全透明的玻璃箱。

致命区别：它和 visibility: hidden 一样占据空间，但是它依然可以被鼠标点击到！（因为玻璃虽然透明，但实体还在）。
*/
	</style>
