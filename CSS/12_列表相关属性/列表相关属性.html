<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<title></title>
	<style>
        ul{
            list-style-type: decimal;
            /* 列表样式类型，其实就是列表开头的黑点 */
            /* none,squre,upper-roman,decimal等等，有很多 */
            list-style-position: outside;
            /* 控制列表符号的位置 ,在不在列表之内*/
            list-style-image:url("./大古.jpg");
            /* 自定义列表图片 */
            
            /* list-style:   ; */
            /* 还有类似于字体复合属性的列表复合属性，没有数量和顺序的要求 */
        }
        li{
            background-color: yellow;
        }
	</style>
	<script type="text/javascript">

	</script>
</head>
<body>
	<ul>
        <li>暨南大学是世界上最好的大学</li>
        <li>kk是世界上最帅的男人</li>
        <li>Gemini是世界上最蠢的AI</li>
    </ul>
</body>
</html>
